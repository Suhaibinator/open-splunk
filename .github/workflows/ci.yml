name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  protobuf:
    name: Protobuf contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install protobuf generators
        run: make proto-tools

      - name: Format, lint, and generate contracts
        run: make proto

      - name: Check API compatibility
        if: github.event_name == 'pull_request'
        run: >-
          npx --no-install buf breaking
          --against ".git#branch=${{ github.base_ref }}"
          --error-format github-actions

      - name: Verify generated code is current
        run: |
          proto_changes="$(git status --porcelain --untracked-files=all -- proto gen)"
          if [[ -n "${proto_changes}" ]]; then
            echo "::error::Generated protobuf code is stale. Run 'make proto' and commit the result."
            git status --short -- proto gen
            git diff -- proto gen
            exit 1
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Next.js
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('.node-version', 'package-lock.json') }}-${{ hashFiles('app/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('.node-version', 'package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test frontend and build transactions
        run: npm run test:frontend

      - name: Build static UI
        run: npm run build

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The fixed lint baseline below must remain available even after many
          # incremental main pushes.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # Ratchet the inherited backlog from the adoption checkpoint. A fixed
          # revision (rather than each push's "before" SHA) ensures that
          # concurrency-cancelled intermediate runs cannot hide a new issue.
          # Do not advance this baseline; reduce the legacy inventory in
          # separate cleanup waves while every subsequent change stays clean.
          args: --timeout=5m --new-from-rev=327a1625b7a080c9c52a31b856da03633c4cb102

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test with race detection and coverage
        run: >-
          go test
          -race
          -shuffle=on
          -covermode=atomic
          -coverprofile=coverage.out
          ./...

      - name: Upload Go coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  gradethis-corpus:
    name: GradeThis compatibility corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Execute exact GradeThis corpus and plans against pinned ClickHouse
        env:
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
          OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE: clickhouse/clickhouse-server:26.3.17.4@sha256:85c434814ac8905e5648027ce926f74ab067edd6aadbccb6c0c165cd3571ea49
        run: >-
          go test ./internal/queryexec ./internal/searchinspection ./internal/server
          -run '^(TestGradeThis(CompatibilityV0_1|InspectionService)AgainstClickHouse|TestSearchInspectionRouteGradeThisAgainstClickHouse)$'
          -count=1
          -timeout=6m
          -p=1
          -v

  backend-vertical:
    name: Backend vertical
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend and browser dependencies
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium

      - name: Test backend vertical and deletion lifecycle
        env:
          OPEN_SPLUNK_BACKEND_INTEGRATION: "1"
          OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE: clickhouse/clickhouse-server:26.3.17.4@sha256:85c434814ac8905e5648027ce926f74ab067edd6aadbccb6c0c165cd3571ea49
        run: >-
          go test ./integration
          -run '^Test(BackendIndexDataDeletionLifecycle|BackendVertical|Browser(FixedResultRendering|SearchCancellation|Sequence(ExpiredRecovery|Gap(REST(FirstProgress|Terminal))?Recovery)))$'
          -count=1
          -timeout=25m
          -v

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-vertical-browser-failure
          path: |
            test-results/backend-vertical
            test-results/browser-search-cancellation
            test-results/browser-sequence-expired
            test-results/browser-sequence-gap
            test-results/browser-sequence-gap-rest-first-progress
            test-results/browser-sequence-gap-rest-terminal
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser rendering measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-fixed-result-rendering
          path: test-results/browser-fixed-result-rendering
          if-no-files-found: ignore
          retention-days: 14

  go-vulnerability:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scan reachable Go code
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""
          go-version-file: go.mod
          cache-dependency-path: go.sum
          go-package: ./...

  build:
    name: Production binaries (${{ matrix.label }})
    needs:
      - backend-vertical
      - frontend
      - gradethis-corpus
      - go-lint
      - go-test
      - go-vulnerability
      - protobuf
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-latest
          - label: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Build server, collector, and log generator
        env:
          OPEN_SPLUNK_SOURCE_REVISION: ${{ github.sha }}
        run: make release

      - name: Verify embedded release payload
        run: |
          mkdir -p release-proof
          ./build/open-splunk-server -verify-embedded-release > release-proof/verification.txt
          cmp build/release-verification.txt release-proof/verification.txt
          cp build/asset-manifest.json release-proof/asset-manifest.json
          cp build/binary-identities.txt release-proof/binary-identities.txt

      - name: Upload release proof
        uses: actions/upload-artifact@v7
        with:
          name: release-proof-${{ matrix.label }}
          path: release-proof
          if-no-files-found: error
          retention-days: 14

      - name: Package binaries
        if: matrix.label == 'linux-amd64'
        run: |
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar \
            --format=gnu \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            -C build \
            -cf - \
            open-splunk-server \
            open-splunk-collector \
            open-splunk-loggen |
            gzip -n > open-splunk-linux-amd64.tar.gz

      - name: Upload binaries
        if: matrix.label == 'linux-amd64'
        uses: actions/upload-artifact@v7
        with:
          name: open-splunk-linux-amd64
          path: open-splunk-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14
          archive: false

  release-assets-consistency:
    name: Linux/macOS release asset consistency
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Linux release proof
        uses: actions/download-artifact@v7
        with:
          name: release-proof-linux-amd64
          path: release-proof/linux

      - name: Download macOS release proof
        uses: actions/download-artifact@v7
        with:
          name: release-proof-macos
          path: release-proof/macos

      - name: Compare canonical embedded assets
        run: |
          cmp release-proof/linux/asset-manifest.json release-proof/macos/asset-manifest.json
          cmp release-proof/linux/binary-identities.txt release-proof/macos/binary-identities.txt
          cmp release-proof/linux/verification.txt release-proof/macos/verification.txt
