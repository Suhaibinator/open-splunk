name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  protobuf:
    name: Protobuf contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install protobuf generators
        run: make proto-tools

      - name: Format, lint, and generate contracts
        run: make proto

      - name: Check API compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git branch --force "${BASE_REF}" "origin/${BASE_REF}"
          node scripts/check-buf-breaking.mjs --against-ref "${BASE_REF}"

      - name: Verify generated code is current
        run: |
          proto_changes="$(git status --porcelain --untracked-files=all -- proto gen)"
          if [[ -n "${proto_changes}" ]]; then
            echo "::error::Generated protobuf code is stale. Run 'make proto' and commit the result."
            git status --short -- proto gen
            git diff -- proto gen
            exit 1
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Next.js
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('.node-version', 'package-lock.json') }}-${{ hashFiles('app/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('.node-version', 'package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test frontend and build transactions
        run: npm run test:frontend

      - name: Build static UI
        run: npm run build

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # The inherited inventory is clean; enforce the complete Go tree on
          # every push rather than retaining a historical diff-only baseline.
          args: --timeout=5m

  go-test:
    name: Go tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    # Every race shard and the coverage row retain the same aggregate budget;
    # each package invocation remains bounded at 40 minutes.
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    # Race instrumentation and atomic coverage each retain a full-tree gate.
    # Core packages and the migration-heavy catalog test binary are partitioned
    # by fail-closed dynamic inventories. Every package and every top-level
    # catalog test, example, fuzz seed, and subtest still runs under race.
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - label: race detector, non-catalog packages shard 1/4
            mode: race-core
            shard_index: 0
            shard_count: 4
            upload_coverage: false
            job_timeout_minutes: 45
          - label: race detector, non-catalog packages shard 2/4
            mode: race-core
            shard_index: 1
            shard_count: 4
            upload_coverage: false
            job_timeout_minutes: 45
          - label: race detector, non-catalog packages shard 3/4
            mode: race-core
            shard_index: 2
            shard_count: 4
            upload_coverage: false
            job_timeout_minutes: 45
          - label: race detector, non-catalog packages shard 4/4
            mode: race-core
            shard_index: 3
            shard_count: 4
            upload_coverage: false
            job_timeout_minutes: 45
          - label: race detector, knowledge catalog shard 1/4
            mode: race-catalog
            shard_index: 0
            shard_count: 4
            upload_coverage: false
            job_timeout_minutes: 45
          - label: race detector, knowledge catalog shard 2/4
            mode: race-catalog
            shard_index: 1
            shard_count: 4
            upload_coverage: false
            job_timeout_minutes: 45
          - label: race detector, knowledge catalog shard 3/4
            mode: race-catalog
            shard_index: 2
            shard_count: 4
            upload_coverage: false
            job_timeout_minutes: 45
          - label: race detector, knowledge catalog shard 4/4
            mode: race-catalog
            shard_index: 3
            shard_count: 4
            upload_coverage: false
            job_timeout_minutes: 45
          - label: atomic coverage
            mode: coverage
            upload_coverage: true
            job_timeout_minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test full repository with atomic coverage
        if: matrix.mode == 'coverage'
        run: >-
          go test
          -shuffle=on
          -covermode=atomic
          -coverprofile=coverage.out
          -timeout=40m
          ./...

      - name: Test non-catalog packages with the race detector
        if: matrix.mode == 'race-core'
        env:
          GOMAXPROCS: "2"
        run: >-
          scripts/run-go-race-shard.sh core
          ${{ matrix.shard_index }}
          ${{ matrix.shard_count }}

      - name: Test knowledge catalog shard with the race detector
        if: matrix.mode == 'race-catalog'
        env:
          GOMAXPROCS: "2"
        run: >-
          scripts/run-go-race-shard.sh catalog
          ${{ matrix.shard_index }}
          ${{ matrix.shard_count }}

      - name: Upload Go coverage
        if: matrix.upload_coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  knowledge-object-fuzz:
    name: Knowledge object fuzz (${{ matrix.label }})
    runs-on: ubuntu-latest
    # Catalog's complete deterministic campaign is approximately nine minutes
    # on the calibrated runner; individual targets remain bounded at two.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go 1.26.6 can retain a wall-clock fuzz deadline if child-context
          # cancellation lags during coordinator shutdown (golang/go#75804).
          # Pair every exact target with a slow-runner-calibrated execution
          # limit so shutdown uses the coordinator's clean limit path.
          - label: selectors
            package: ./internal/knowledge
            target_budgets: |
              ^FuzzNormalizePattern$ 500000x
              ^FuzzSelectorMatchReference$ 300000x
              ^FuzzSelectorMultiPatternORReference$ 300000x
              ^FuzzSelectorCanonicalOrder$ 500000x
          - label: definitions
            package: ./internal/knowledgedefinition
            target_budgets: |
              ^FuzzDecodeCanonicalNeverPanicsAndSuccessIsStable$ 250000x
              ^FuzzNormalizeNeverPanicsAndSuccessIsIdempotent$ 275000x
              ^FuzzDecodeCanonicalFutureBodyNeverPanicsAndSuccessIsStable$ 200000x
              ^FuzzInactiveFutureBodyCanonicalWireRoundTrip$ 250000x
              ^FuzzInactiveFutureBodyDisallowedStateAlwaysWins$ 250000x
          - label: catalog
            package: ./internal/knowledgecatalog
            target_budgets: |
              ^FuzzCalculatedDependencyInputFields$ 60000x
              ^FuzzCatalogFingerprintCanonicalizesSetLikeInputs$ 80000x
              ^FuzzCatalogCursorRoundTripPreservesTypedKeyset$ 70000x
              ^FuzzBoundedListResponseRecordsMatchesReferenceModel$ 70000x
              ^FuzzDecodeCursorRejectsMalformedOrReboundInput$ 120000x
              ^FuzzKnowledgeUpdateMaskCanonicalization$ 100000x
              ^FuzzApplyKnowledgeDefinitionMaskIsDetachedAndStable$ 80000x
              ^FuzzPrepareCreateMutationCanonicalDigest$ 75000x
              ^FuzzKnowledgeOutcomeReferenceStrictDecode$ 100000x
              ^FuzzValidatePublicationActiveCandidateAlphaRename$ 40000x
          - label: spl-parser
            package: ./internal/spl
            target_budgets: |
              ^FuzzParseDoesNotPanic$ 350000x
              ^FuzzParseV02ExpressionFragmentsCanonicalize$ 150000x
              ^FuzzParseV02ExpressionsAreDeterministicAndAtomic$ 250000x
          - label: hec-protocol
            package: ./internal/hec
            target_budgets: |
              ^FuzzDecodeAcknowledgmentRequest$ 150000x
              ^FuzzParseAuthorization$ 50000x
              ^FuzzParseChannel$ 450000x
              ^FuzzGzipLimitEnforcement$ 100000x
              ^FuzzClassifyFieldNumber$ 400000x
              ^FuzzEnvelopeDecoder$ 150000x
              ^FuzzParseEpochNanoseconds$ 425000x
              ^FuzzParseRawQuery$ 125000x
              ^FuzzRawBreaker$ 100000x
              ^FuzzMarshalResponse$ 400000x
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify exact fuzz target inventory
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET_BUDGETS: ${{ matrix.target_budgets }}
        run: |
          set -euo pipefail
          artifact_dir="fuzz-artifacts/${{ matrix.label }}"
          mkdir -p "$artifact_dir"
          printf '%s\n' "$FUZZ_TARGET_BUDGETS" > "$artifact_dir/exact-target-budgets.txt"
          : > "$artifact_dir/exact-target-regexes.txt"
          : > "$artifact_dir/declared-targets.txt"
          while read -r target_regex target_fuzz_time extra; do
            if [[ -z "$target_regex" ]]; then
              continue
            fi
            target_name="${target_regex#^}"
            target_name="${target_name%$}"
            if [[ -z "$target_fuzz_time" || -n "$extra" ||
              "$target_regex" != "^${target_name}$" ||
              ! "$target_name" =~ ^Fuzz[A-Za-z0-9_]+$ ||
              ! "$target_fuzz_time" =~ ^[1-9][0-9]*x$ ]]; then
              echo "::error::Invalid fuzz target budget: $target_regex $target_fuzz_time $extra"
              exit 1
            fi
            printf '%s\n' "$target_regex" >> "$artifact_dir/exact-target-regexes.txt"
            printf '%s\n' "$target_name" >> "$artifact_dir/declared-targets.txt"
          done < "$artifact_dir/exact-target-budgets.txt"
          LC_ALL=C sort -o \
            "$artifact_dir/declared-targets.txt" \
            "$artifact_dir/declared-targets.txt"
          go test "$FUZZ_PACKAGE" -list '^Fuzz' |
            sed -n '/^Fuzz/p' |
            LC_ALL=C sort > "$artifact_dir/discovered-targets.txt"
          diff -u \
            "$artifact_dir/declared-targets.txt" \
            "$artifact_dir/discovered-targets.txt"

      - name: Fuzz every declared target within its own budget
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET_BUDGETS: ${{ matrix.target_budgets }}
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail
          artifact_dir="fuzz-artifacts/${{ matrix.label }}"
          status=0
          while read -r target_regex target_fuzz_time; do
            if [[ -z "$target_regex" ]]; then
              continue
            fi
            target_name="${target_regex#^}"
            target_name="${target_name%$}"
            if ! go test "$FUZZ_PACKAGE" \
              -run '^$' \
              -fuzz "$target_regex" \
              -fuzztime "$target_fuzz_time" \
              -fuzzminimizetime 10s \
              -timeout 2m \
              -parallel 2 \
              -count 1 2>&1 |
              tee "$artifact_dir/${target_name}.log"; then
              status=1
            fi
          done <<< "$FUZZ_TARGET_BUDGETS"
          exit "$status"

      - name: Upload fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-object-fuzz-${{ matrix.label }}-failure
          path: |
            fuzz-artifacts/${{ matrix.label }}
            ${{ matrix.package }}/testdata/fuzz
          if-no-files-found: error
          retention-days: 14

  gradethis-corpus:
    name: GradeThis compatibility corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE: clickhouse/clickhouse-server:26.7.3.19@sha256:f90a77560f72b10802106ee49e9870e41668cbc496e280c3911f6e3b216657f3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Pre-pull pinned ClickHouse image with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull "$OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Execute exact GradeThis corpus and plans against pinned ClickHouse
        env:
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
        run: >-
          go test ./internal/queryexec ./internal/searchinspection ./internal/server
          -run '^(TestGradeThis(CompatibilityV0_1|InspectionService)AgainstClickHouse|TestSearchInspectionRouteGradeThisAgainstClickHouse)$'
          -count=1
          -timeout=6m
          -p=1
          -v

  knowledge-runtime-clickhouse:
    name: Knowledge runtime ClickHouse matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE: clickhouse/clickhouse-server:26.7.3.19@sha256:f90a77560f72b10802106ee49e9870e41668cbc496e280c3911f6e3b216657f3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Pre-pull pinned ClickHouse image with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull "$OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Execute exact production knowledge runtime matrix
        env:
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
        run: >-
          go test ./internal/queryexec
          -run '^TestKnowledgeCompilerAndExecutorMatrixAgainstClickHouse$'
          -count=1
          -timeout=4m30s
          -p=1
          -v

      # Runs as its own step so the matrix above keeps its dedicated 4m30s
      # process deadline. This proves the sealed stats wc-field discovery
      # budget still admits a knowledge-bearing prefix on the pinned server;
      # that budget is a planning budget and its floor moves with the release.
      - name: Execute production stats wildcard inventory discovery
        env:
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
        run: >-
          go test ./internal/queryexec
          -run '^TestStatsWildcardInventoryAgainstClickHouse$'
          -count=1
          -timeout=2m
          -p=1
          -v

  spl-compatibility-clickhouse:
    name: SPL compatibility pinned ClickHouse verticals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE: clickhouse/clickhouse-server:26.7.3.19@sha256:f90a77560f72b10802106ee49e9870e41668cbc496e280c3911f6e3b216657f3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Read exact authored SPL compatibility identity
        run: |
          set -euo pipefail
          compatibility_version="$(node scripts/read-spl-compatibility-version.mjs)"
          case "$compatibility_version" in
            0.2|0.3) ;;
            *)
              echo "::error::No pinned ClickHouse qualification matrix exists for SPL compatibility $compatibility_version."
              exit 1
              ;;
          esac
          echo "OPEN_SPLUNK_SPL_COMPATIBILITY_VERSION=$compatibility_version" >>"$GITHUB_ENV"

      - name: Verify exact SPL evidence phase on the clean checkout
        run: |
          set -euo pipefail
          case "$OPEN_SPLUNK_SPL_COMPATIBILITY_VERSION" in
            0.2)
              manifest_path="docs/evidence/spl-v0.2-activation/manifest.json"
              verifier="scripts/verify-spl-v02-acceptance.mjs"
              ;;
            0.3)
              manifest_path="docs/evidence/spl-v0.3/manifest.json"
              verifier="scripts/verify-spl-v03-acceptance.mjs"
              ;;
          esac
          phase="$(node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (typeof manifest.phase !== "string") process.exit(1);
            process.stdout.write(`${manifest.phase}\n`);
          ' "$manifest_path")"
          case "$phase" in
            implementation-checkpoint|qualification-candidate|accepted) ;;
            *)
              echo "::error::Unsupported SPL evidence phase $phase."
              exit 1
              ;;
          esac
          if [[ "$phase" = "accepted" ]]; then
            evidence_revision="$(
              git log -1 --format=%H -- "$manifest_path"
            )"
            if [[ ! "$evidence_revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve the exact accepted SPL evidence revision."
              exit 1
            fi
            node "$verifier" \
              --phase accepted \
              --evidence-revision "$evidence_revision" \
              --print-evidence-binding
          else
            node "$verifier" --phase "$phase"
          fi

      - name: Verify exact SPL compatibility ClickHouse test inventory
        run: |
          set -euo pipefail
          require_exact_test() {
            local package="$1"
            local name="$2"
            local output
            local match_count
            output="$(go test "$package" -list "^${name}$")"
            match_count="$(
              printf '%s\n' "$output" |
                awk -v expected="$name" '$0 == expected { count++ } END { print count + 0 }'
            )"
            if [[ "$match_count" -ne 1 ]]; then
              echo "::error::Expected exactly one discovered test $package.$name; found $match_count"
              exit 1
            fi
          }
          while read -r package name; do
            require_exact_test "$package" "$name"
          done <<'EOF'
          ./internal/clickhouse TestStatsByDeferredValidationAdversarialAgainstClickHouse
          ./internal/clickhouse TestStatsMultivalueByAgainstClickHouse
          ./internal/clickhouse TestStatsMultivalueByExpansionLimitAgainstClickHouse
          ./internal/clickhouse TestStatsByUnsupportedCannotHideBehindMissingKeyAgainstClickHouse
          ./internal/queryexec TestStatsByFixedMultivalueStringOrBytesAgainstClickHouse
          ./internal/queryexec TestSemanticBytesV02ManagerAgainstClickHouse
          ./internal/queryexec TestSemanticBytesModeManagerAgainstClickHouse
          ./internal/queryexec TestSparklineFeedsStatsByThroughManagerAgainstClickHouse
          EOF
          if [[ "$OPEN_SPLUNK_SPL_COMPATIBILITY_VERSION" = "0.3" ]]; then
            while read -r package name; do
              require_exact_test "$package" "$name"
            done <<'EOF'
          ./internal/clickhouse TestV03AdversarialAgainstClickHouse
          ./internal/clickhouse TestV03FillNullDynamicThenMVExpandAgainstClickHouse
          ./internal/clickhouse TestV03FillNullAfterPrivatePhysicalProducersAgainstClickHouse
          ./internal/export TestV03PinnedClickHousePublishesNullableListsThroughPagingAndExport
          ./internal/clickhouse TestV03PinnedClickHouseRetainedTupleHasCanonicalBytes
          ./internal/queryexec TestSemanticBytesLineageManagerAgainstClickHouse
          ./internal/queryexec TestV03AllTenPreserveUntouchedSemanticBytesThroughManagerAgainstClickHouse
          EOF
          fi

      - name: Pre-pull pinned ClickHouse image with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull "$OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Execute v0.2 stats-BY and semantic String/Bytes matrix
        env:
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
        run: >-
          go test ./internal/clickhouse ./internal/queryexec
          -run '^(TestStatsByDeferredValidationAdversarialAgainstClickHouse|TestStatsMultivalueByAgainstClickHouse|TestStatsMultivalueByExpansionLimitAgainstClickHouse|TestStatsByUnsupportedCannotHideBehindMissingKeyAgainstClickHouse|TestStatsByFixedMultivalueStringOrBytesAgainstClickHouse|TestSemanticBytesV02ManagerAgainstClickHouse|TestSemanticBytesModeManagerAgainstClickHouse|TestSparklineFeedsStatsByThroughManagerAgainstClickHouse)$'
          -count=1
          -timeout=15m
          -p=1
          -v

      - name: Execute complete adversarial SPL v0.3 matrix
        if: env.OPEN_SPLUNK_SPL_COMPATIBILITY_VERSION == '0.3'
        env:
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
        run: >-
          go test ./internal/clickhouse
          -run '^TestV03AdversarialAgainstClickHouse$'
          -count=1
          -timeout=15m
          -p=1
          -v

      - name: Verify fillnull materialization through expansion and private producers
        if: env.OPEN_SPLUNK_SPL_COMPATIBILITY_VERSION == '0.3'
        env:
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
        run: >-
          go test ./internal/clickhouse
          -run '^(TestV03FillNullDynamicThenMVExpandAgainstClickHouse|TestV03FillNullAfterPrivatePhysicalProducersAgainstClickHouse)$'
          -count=1
          -timeout=15m
          -p=1
          -v

      - name: Execute public paging and export vertical
        if: env.OPEN_SPLUNK_SPL_COMPATIBILITY_VERSION == '0.3'
        env:
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
        run: >-
          go test ./internal/export
          -run '^TestV03PinnedClickHousePublishesNullableListsThroughPagingAndExport$'
          -count=1
          -timeout=15m
          -p=1
          -v

      - name: Verify canonical retained-result byte accounting
        if: env.OPEN_SPLUNK_SPL_COMPATIBILITY_VERSION == '0.3'
        env:
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
        run: >-
          go test ./internal/clickhouse
          -run '^TestV03PinnedClickHouseRetainedTupleHasCanonicalBytes$'
          -count=1
          -timeout=15m
          -p=1
          -v

      - name: Verify semantic String and Bytes lineage through manager publication
        if: env.OPEN_SPLUNK_SPL_COMPATIBILITY_VERSION == '0.3'
        env:
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
        run: >-
          go test ./internal/queryexec
          -run '^(TestSemanticBytesLineageManagerAgainstClickHouse|TestV03AllTenPreserveUntouchedSemanticBytesThroughManagerAgainstClickHouse)$'
          -count=1
          -timeout=15m
          -p=1
          -v

  hec-durable-load:
    name: HEC durable (${{ matrix.label }})
    runs-on: ubuntu-latest
    # Standard hosted runners have no calibrated storage-IOPS contract. Keep
    # the default mixed 50/950 release qualification intact for recorded
    # machine sizing. The small-only profile observes correctness, bounded
    # backpressure, and saturation behavior; it is not a throughput proof. The
    # independently rate-gated batch-only profile proves 1,000 EPS.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: observational 50 requests/s small-only correctness/backpressure saturation and outage recovery
            events_per_second: "50"
            profile: small-only
          - label: rate-gated 1,000 EPS batch-only throughput and outage recovery
            events_per_second: "1000"
            profile: batch-only
    env:
      OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE: clickhouse/clickhouse-server:26.7.3.19@sha256:f90a77560f72b10802106ee49e9870e41668cbc496e280c3911f6e3b216657f3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download Go modules with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Pre-pull pinned ClickHouse image with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull "$OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Run ${{ matrix.label }}
        env:
          OPEN_SPLUNK_HEC_LOAD: "1"
          OPEN_SPLUNK_HEC_LOAD_EVENTS_PER_SECOND: ${{ matrix.events_per_second }}
          OPEN_SPLUNK_HEC_LOAD_PROFILE: ${{ matrix.profile }}
        run: >-
          go test ./integration
          -run '^TestBackendHECDurableLoad$'
          -count=1
          -timeout=15m
          -p=1
          -v

  backend-vertical:
    name: Backend vertical
    runs-on: ubuntu-latest
    # Leave setup, the 30-minute general vertical, and the isolated HEC
    # functional checks enough headroom to fail on their own bounded deadlines.
    timeout-minutes: 45
    env:
      OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE: clickhouse/clickhouse-server:26.7.3.19@sha256:f90a77560f72b10802106ee49e9870e41668cbc496e280c3911f6e3b216657f3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify exact SPL v0.2 stats-BY test inventory
        run: |
          set -euo pipefail
          require_exact_test() {
            local package="$1"
            local name="$2"
            local output
            local match_count
            output="$(go test "$package" -list "^${name}$")"
            match_count="$(
              printf '%s\n' "$output" |
                awk -v expected="$name" '$0 == expected { count++ } END { print count + 0 }'
            )"
            if [[ "$match_count" -ne 1 ]]; then
              echo "::error::Expected exactly one discovered test $package.$name; found $match_count"
              exit 1
            fi
          }
          while read -r package name; do
            require_exact_test "$package" "$name"
          done <<'EOF'
          ./internal/clickhouse TestStatsByDeferredValidationAdversarialAgainstClickHouse
          ./internal/clickhouse TestStatsMultivalueByAgainstClickHouse
          ./internal/clickhouse TestStatsMultivalueByExpansionLimitAgainstClickHouse
          ./internal/clickhouse TestStatsByUnsupportedCannotHideBehindMissingKeyAgainstClickHouse
          ./internal/queryexec TestStatsByFixedMultivalueStringOrBytesAgainstClickHouse
          EOF

      - name: Download Go modules with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Pre-pull pinned ClickHouse image with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull "$OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend and browser dependencies
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium

      - name: Test backend vertical and deletion lifecycle
        env:
          OPEN_SPLUNK_BACKEND_INTEGRATION: "1"
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
        # The Store lifecycle reserves 5m setup + 20m compiler + 2m deletion
        # and 30s cleanup headroom beneath this process deadline.
        run: >-
          go test ./cmd/open-splunk-server ./internal/clickhouse ./internal/indexes ./internal/queryexec ./internal/server ./integration ./migrations/clickhouse
          -run '^Test(ClickHouseTLSServicePrincipalStartupLifecycle|ClickHouseServicePrincipalLifecycle|IndexDataDeletionCoordinatorAgainstClickHouse|IndexStatisticsReaderAgainstClickHouse|StoreAgainstClickHouse|NumericChartAgainstClickHouse|ChartPercentileAgainstClickHouse|ExpressionV02AgainstClickHouse|ExpressionV02ExecutorManagerAgainstClickHouse|ExecutorAndManagerAgainstClickHouse|StatsByDeferredValidationAdversarialAgainstClickHouse|StatsMultivalueByAgainstClickHouse|StatsMultivalueByExpansionLimitAgainstClickHouse|StatsByUnsupportedCannotHideBehindMissingKeyAgainstClickHouse|StatsByFixedMultivalueStringOrBytesAgainstClickHouse|DeploymentComposePersistentCredentialRotation|DeploymentNativeRecoveryClickHouseLifecycle|BackendIndexDataDeletionLifecycle|BackendVertical|Browser(FixedResultRendering|SearchCancellation|Sequence(ExpiredRecovery|Gap(REST(FirstProgress|Terminal))?Recovery)))$'
          -count=1
          -timeout=30m
          -p=1
          -v

      # Runs as its own step so the 30-minute vertical above keeps its reserved
      # budget. Both tests own one container each and execute a 10,000-row pivot
      # under the production executor defaults, which takes well under a minute
      # per test on a warm image; the deadline below leaves room for a cold pull
      # and container startup without masking a hang. These pin the row ceiling
      # the compiler advertises: that landing exactly on it publishes the whole
      # pivot within the default memory budget, that crossing it fails
      # atomically, and that the widest published column domain is exact.
      - name: Test chart transport row ceiling and column domain
        env:
          OPEN_SPLUNK_CLICKHOUSE_INTEGRATION: "1"
        run: >-
          go test ./internal/queryexec
          -run '^TestChartBreakTransport(RowCeiling|CeilingLabelDomain)AgainstClickHouse$'
          -count=1
          -timeout=6m
          -p=1
          -v

      - name: Test HEC ingestion-to-SPL vertical
        env:
          OPEN_SPLUNK_BACKEND_INTEGRATION: "1"
        run: >-
          go test ./integration
          -run '^TestBackendHECVertical$'
          -count=1
          -timeout=8m
          -v

      - name: Test HEC slow compressed read deadline
        env:
          OPEN_SPLUNK_HEC_SLOW_CLIENT: "1"
        run: >-
          go test ./integration
          -run '^TestBackendHECSlowCompressedReadDeadline$'
          -count=1
          -timeout=15m
          -v

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-vertical-browser-failure
          path: |
            test-results/backend-vertical
            test-results/browser-search-cancellation
            test-results/browser-sequence-expired
            test-results/browser-sequence-gap
            test-results/browser-sequence-gap-rest-first-progress
            test-results/browser-sequence-gap-rest-terminal
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser rendering measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-fixed-result-rendering
          path: test-results/browser-fixed-result-rendering
          if-no-files-found: ignore
          retention-days: 14

  release-oci:
    name: Release OCI contract
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Bind release application identity to authored SPL compatibility
        run: |
          set -euo pipefail
          compatibility_version="$(node scripts/read-spl-compatibility-version.mjs)"
          case "$compatibility_version" in
            0.2) application_version=0.1.0 ;;
            0.3) application_version=0.2.0 ;;
            *)
              echo "::error::Unsupported authored SPL compatibility identity $compatibility_version."
              exit 1
              ;;
          esac
          {
            echo "OPEN_SPLUNK_EXPECTED_SPL_COMPATIBILITY_VERSION=$compatibility_version"
            echo "OPEN_SPLUNK_APPLICATION_VERSION=$application_version"
          } >>"$GITHUB_ENV"

      - name: Build and test release images with production Compose
        env:
          OPEN_SPLUNK_OCI_INTEGRATION: "1"
          OPEN_SPLUNK_CLICKHOUSE_TEST_IMAGE: clickhouse/clickhouse-server:26.7.3.19@sha256:f90a77560f72b10802106ee49e9870e41668cbc496e280c3911f6e3b216657f3
        run: >-
          go test ./integration
          -run '^TestReleaseOCIComposeContract$'
          -count=1
          -timeout=25m
          -v

      - name: Cross-build exact release images for Linux ARM64
        env:
          OPEN_SPLUNK_SOURCE_REVISION: ${{ github.sha }}
          OPEN_SPLUNK_OCI_PLATFORM: linux/arm64
          OPEN_SPLUNK_SERVER_IMAGE: open-splunk-ci/server-arm64:${{ github.sha }}
          OPEN_SPLUNK_COLLECTOR_IMAGE: open-splunk-ci/collector-arm64:${{ github.sha }}
        run: |
          set -euo pipefail
          oci_proof_root=""
          server_container=""
          collector_container=""
          reproducible_server_image="${OPEN_SPLUNK_SERVER_IMAGE}-repro"
          reproducible_collector_image="${OPEN_SPLUNK_COLLECTOR_IMAGE}-repro"
          cleanup() {
            if [[ -n "$server_container" ]]; then
              docker container rm --force "$server_container" >/dev/null 2>&1 || true
            fi
            if [[ -n "$collector_container" ]]; then
              docker container rm --force "$collector_container" >/dev/null 2>&1 || true
            fi
            docker image rm --force \
              "$OPEN_SPLUNK_SERVER_IMAGE" \
              "$OPEN_SPLUNK_COLLECTOR_IMAGE" \
              "$reproducible_server_image" \
              "$reproducible_collector_image" >/dev/null 2>&1 || true
            if [[ -n "$oci_proof_root" ]]; then
              rm -rf -- "$oci_proof_root"
            fi
          }
          trap cleanup EXIT
          make oci
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$OPEN_SPLUNK_SERVER_IMAGE")" = "linux/arm64"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$OPEN_SPLUNK_COLLECTOR_IMAGE")" = "linux/arm64"

          # Local image IDs digest the runtime config; the ordered RootFS diff IDs
          # independently cover canonical filesystem content without attestations.
          server_config_digest="$(docker image inspect --format '{{.Id}}' "$OPEN_SPLUNK_SERVER_IMAGE")"
          collector_config_digest="$(docker image inspect --format '{{.Id}}' "$OPEN_SPLUNK_COLLECTOR_IMAGE")"
          server_layer_digests="$(docker image inspect --format '{{json .RootFS.Layers}}' "$OPEN_SPLUNK_SERVER_IMAGE")"
          collector_layer_digests="$(docker image inspect --format '{{json .RootFS.Layers}}' "$OPEN_SPLUNK_COLLECTOR_IMAGE")"

          oci_proof_root="$(mktemp -d)"
          server_container="$(docker container create --platform linux/arm64 "$OPEN_SPLUNK_SERVER_IMAGE")"
          collector_container="$(docker container create --platform linux/arm64 "$OPEN_SPLUNK_COLLECTOR_IMAGE")"
          docker cp \
            "${server_container}:/usr/local/bin/open-splunk-server" \
            "$oci_proof_root/open-splunk-server"
          docker cp \
            "${collector_container}:/usr/local/bin/open-splunk-collector" \
            "$oci_proof_root/open-splunk-collector"
          node scripts/verify-elf-architecture.mjs \
            arm64 \
            "$oci_proof_root/open-splunk-server" \
            "$oci_proof_root/open-splunk-collector"

          OPEN_SPLUNK_SERVER_IMAGE="$reproducible_server_image" \
          OPEN_SPLUNK_COLLECTOR_IMAGE="$reproducible_collector_image" \
          OPEN_SPLUNK_OCI_NO_CACHE=1 \
            make oci
          test "$server_config_digest" = \
            "$(docker image inspect --format '{{.Id}}' "$reproducible_server_image")"
          test "$collector_config_digest" = \
            "$(docker image inspect --format '{{.Id}}' "$reproducible_collector_image")"
          test "$server_layer_digests" = \
            "$(docker image inspect --format '{{json .RootFS.Layers}}' "$reproducible_server_image")"
          test "$collector_layer_digests" = \
            "$(docker image inspect --format '{{json .RootFS.Layers}}' "$reproducible_collector_image")"

  go-vulnerability:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scan reachable Go code
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""
          go-version-file: go.mod
          cache-dependency-path: go.sum
          go-package: ./...

  build:
    name: Production binaries (${{ matrix.label }})
    needs:
      - backend-vertical
      - frontend
      - gradethis-corpus
      - go-lint
      - go-test
      - hec-durable-load
      - knowledge-object-fuzz
      - knowledge-runtime-clickhouse
      - go-vulnerability
      - protobuf
      - release-oci
      - spl-compatibility-clickhouse
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-latest
          - label: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Read exact authored SPL compatibility identity
        run: |
          set -euo pipefail
          compatibility_version="$(node scripts/read-spl-compatibility-version.mjs)"
          case "$compatibility_version" in
            0.2) application_version=0.1.0 ;;
            0.3) application_version=0.2.0 ;;
            *)
              echo "::error::Unsupported authored SPL compatibility identity $compatibility_version."
              exit 1
              ;;
          esac
          {
            echo "OPEN_SPLUNK_EXPECTED_SPL_COMPATIBILITY_VERSION=$compatibility_version"
            echo "OPEN_SPLUNK_APPLICATION_VERSION=$application_version"
          } >>"$GITHUB_ENV"

      - name: Verify OCI launcher portability on macOS Bash
        if: runner.os == 'macOS'
        run: node --test scripts/build-oci.test.mjs

      - name: Verify macOS generated-secret ACL hardening
        if: runner.os == 'macOS'
        run: >-
          go test ./migrations/clickhouse
          -run '^TestGenerateEnvClearsDarwinInheritedACLs$'
          -count=1
          -v

      - name: Build server, collector, and log generator
        env:
          OPEN_SPLUNK_SOURCE_REVISION: ${{ github.sha }}
        run: make release

      - name: Verify embedded release payload
        run: |
          mkdir -p release-proof
          ./build/open-splunk-server -verify-embedded-release > release-proof/verification.txt
          cmp build/release-verification.txt release-proof/verification.txt
          test "$(sed -n '1p' release-proof/verification.txt)" = \
            "application_version=${OPEN_SPLUNK_APPLICATION_VERSION}"
          test "$(sed -n '3p' release-proof/verification.txt)" = \
            "spl_compatibility_version=${OPEN_SPLUNK_EXPECTED_SPL_COMPATIBILITY_VERSION}"
          cp build/asset-manifest.json release-proof/asset-manifest.json
          cp build/binary-identities.txt release-proof/binary-identities.txt

      - name: Upload release proof
        uses: actions/upload-artifact@v7
        with:
          name: release-proof-${{ matrix.label }}
          path: release-proof
          if-no-files-found: error
          retention-days: 14

      - name: Package binaries
        if: matrix.label == 'linux-amd64'
        run: |
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar \
            --format=gnu \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            -C build \
            -cf - \
            open-splunk-server \
            open-splunk-collector \
            open-splunk-loggen |
            gzip -n > open-splunk-linux-amd64.tar.gz

      - name: Upload binaries
        if: matrix.label == 'linux-amd64'
        uses: actions/upload-artifact@v7
        with:
          name: open-splunk-linux-amd64
          path: open-splunk-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14
          archive: false

  release-assets-consistency:
    name: Linux/macOS release asset consistency
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Linux release proof
        uses: actions/download-artifact@v8
        with:
          name: release-proof-linux-amd64
          path: release-proof/linux

      - name: Download macOS release proof
        uses: actions/download-artifact@v8
        with:
          name: release-proof-macos
          path: release-proof/macos

      - name: Compare canonical embedded assets
        run: |
          cmp release-proof/linux/asset-manifest.json release-proof/macos/asset-manifest.json
          cmp release-proof/linux/binary-identities.txt release-proof/macos/binary-identities.txt
          cmp release-proof/linux/verification.txt release-proof/macos/verification.txt
