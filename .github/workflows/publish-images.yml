name: Publish release images

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-release-images
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      application_version: ${{ steps.release.outputs.application_version }}
      image_created: ${{ steps.runtime.outputs.image_created }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      registry: ${{ steps.release.outputs.registry }}
      release_revision: ${{ steps.release.outputs.release_revision }}
      source_date_epoch: ${{ steps.runtime.outputs.source_date_epoch }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Releases require a vMAJOR.MINOR.PATCH tag; $RELEASE_TAG is not one."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::The checked-out release does not match GITHUB_SHA."
            exit 1
          fi

          application_version=${RELEASE_TAG#v}
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

          {
            echo "application_version=$application_version"
            echo "image_tag=$application_version"
            echo "registry=$registry"
            echo "release_revision=$GITHUB_SHA"
          } >>"$GITHUB_OUTPUT"

      - name: Require the tagged commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not an ancestor of origin/main."
            exit 1
          fi

      - name: Require a successful CI run for the tagged commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successful_runs="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f status=completed \
              -f per_page=100 \
              --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length'
          )"
          if [[ ! "$successful_runs" =~ ^[0-9]+$ || "$successful_runs" -lt 1 ]]; then
            echo "::error::No completed CI run concluded success for $GITHUB_SHA."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Verify active release profile and resolve build inputs
        id: runtime
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          compatibility_version="$(node scripts/read-spl-compatibility-version.mjs)"
          if [[ "$package_version" != "0.4.0" || "$compatibility_version" != "0.4" ]]; then
            echo "::error::The active release profile is application 0.4.0 with SPL compatibility 0.4; found $package_version/$compatibility_version."
            exit 1
          fi
          if [[ "${{ steps.release.outputs.application_version }}" != "$package_version" ]]; then
            echo "::error::Release tag application version ${{ steps.release.outputs.application_version }} does not match package version $package_version."
            exit 1
          fi
          image_created="$(git show -s --format=%cI "$GITHUB_SHA")"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          {
            echo "image_created=$image_created"
            echo "source_date_epoch=$source_date_epoch"
          } >>"$GITHUB_OUTPUT"

      - name: Verify OCI publication contract
        run: node --test scripts/build-oci.test.mjs

  build:
    name: Build ${{ matrix.artifact }} (${{ matrix.platform }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: server
            image_name: open-splunk-server
            target: server
            platform: linux/amd64
            architecture: amd64
          - artifact: server
            image_name: open-splunk-server
            target: server
            platform: linux/arm64
            architecture: arm64
          - artifact: collector
            image_name: open-splunk-collector
            target: collector
            platform: linux/amd64
            architecture: amd64
          - artifact: collector
            image_name: open-splunk-collector
            target: collector
            platform: linux/arm64
            architecture: arm64
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_revision }}

      - name: Verify exact tagged checkout
        env:
          RELEASE_REVISION: ${{ needs.verify.outputs.release_revision }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.verify.outputs.registry }}/${{ matrix.image_name }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            OPEN_SPLUNK_APPLICATION_VERSION=${{ needs.verify.outputs.application_version }}
            OPEN_SPLUNK_SOURCE_REVISION=${{ needs.verify.outputs.release_revision }}
            OPEN_SPLUNK_IMAGE_CREATED=${{ needs.verify.outputs.image_created }}
            OPEN_SPLUNK_SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}
            OPEN_SPLUNK_EXPECTED_TARGETOS=linux
            OPEN_SPLUNK_EXPECTED_TARGETARCH=${{ matrix.architecture }}
            SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}
          cache-from: type=gha,scope=${{ matrix.artifact }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}-${{ matrix.architecture }}
          provenance: mode=max
          sbom: true

      - name: Export image digest
        env:
          ARTIFACT: ${{ matrix.artifact }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build returned an invalid $ARTIFACT image digest."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.artifact }} manifest
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: server
            image_name: open-splunk-server
          - artifact: collector
            image_name: open-splunk-collector
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ matrix.artifact }}-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify multi-architecture manifest
        env:
          ARTIFACT: ${{ matrix.artifact }}
          IMAGE: ${{ needs.verify.outputs.registry }}/${{ matrix.image_name }}
          IMAGE_TAG: ${{ needs.verify.outputs.image_tag }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f -print | sort)
          if [[ ${#digest_files[@]} -ne 2 ]]; then
            echo "::error::Expected exactly two $ARTIFACT image digests."
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest=${digest_file##*/}
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid $ARTIFACT digest artifact $digest."
              exit 1
            fi
            sources+=("$IMAGE@sha256:$digest")
          done

          reference="$IMAGE:$IMAGE_TAG"
          docker buildx imagetools create --tag "$reference" "${sources[@]}"
          docker buildx imagetools inspect "$reference"
          docker buildx imagetools inspect "$reference" --raw >"$RUNNER_TEMP/$ARTIFACT-manifest.json"

          actual_platforms=$(jq -r '
            .manifests[]
            | select(.platform.os == "linux")
            | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
            | "\(.platform.os)/\(.platform.architecture)"
          ' "$RUNNER_TEMP/$ARTIFACT-manifest.json" | sort -u)
          expected_platforms=$'linux/amd64\nlinux/arm64'
          if [[ "$actual_platforms" != "$expected_platforms" ]]; then
            echo "::error::Published $ARTIFACT platforms were '$actual_platforms'."
            exit 1
          fi

          echo "Published \`$reference\` for linux/amd64 and linux/arm64." >>"$GITHUB_STEP_SUMMARY"
