version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - modernize
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    modernize:
      # Keep the deletion-oriented analyzers enabled. The remaining analyzers
      # are useful migrations, but do not consistently make the code smaller.
      disable:
        - any
        - fmtappendf
        - forvar
        - omitzero
        - plusbuild
        - reflecttypefor
        - slicesbackward
        - slicessort
        - stditerators
        - stringscut
        - stringscutprefix
        - stringsseq
        - stringsbuilder
        - testingcontext
        - unsafefuncs
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Test helpers conventionally take *testing.T first so callers and helper
      # diagnostics stay uniform; retain context-first enforcement in runtime code.
      - path: _test\.go$
        text: "context-as-argument:"
        linters:
          - revive
      # Scoped `if err := ...` checks are idiomatic and keep each error adjacent
      # to its handling; the shadow analyzer remains enabled for every other name.
      - text: 'shadow: declaration of "err"'
        linters:
          - govet
      # Test fixtures deliberately use bounded casts, synthetic credentials,
      # temporary-file modes, deterministic pseudo-randomness, and controlled
      # subprocesses. Runtime code remains subject to every gosec rule.
      - path: _test\.go$
        text: '^G(101|115|204|301|302|306|404|602|702|703):'
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
