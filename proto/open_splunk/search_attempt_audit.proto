syntax = "proto3";

package open_splunk;

import "google/protobuf/timestamp.proto";
import "open_splunk/audit.proto";
import "open_splunk/knowledge.proto";

option go_package = "github.com/Suhaibinator/open-splunk/gen/go/open_splunk;opensplunk";

// SearchAttemptAuditEvent is the immutable, allowlisted projection of one
// admitted search attempt. It deliberately carries no query, execution, or
// result content.
message SearchAttemptAuditEvent {
  uint64 sequence = 1;
  google.protobuf.Timestamp occurred_at = 2;
  AuditActorKind actor_kind = 3;
  string actor_id = 4;
  AuditActorRole actor_role = 5;
  string owner_id = 6;
  string search_job_id = 7;
  // Audit retains only the compact snapshot identity and exact object count;
  // definition and object inventory remain outside this journal.
  optional KnowledgeSnapshotRef knowledge_snapshot = 8;
}
