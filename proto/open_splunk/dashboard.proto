syntax = "proto3";

package open_splunk;

import "google/protobuf/timestamp.proto";
import "open_splunk/common.proto";
import "open_splunk/search.proto";

option go_package = "github.com/Suhaibinator/open-splunk/gen/go/open_splunk;opensplunk";

// DashboardPanel is one persisted, server-authoritative search visualization.
// Grid coordinates use a twelve-column layout and are presentation hints only.
message DashboardPanel {
  string panel_id = 1;
  string title = 2;
  optional string description = 3;
  SearchDefinition search = 4;
  uint32 column = 5;
  uint32 row = 6;
  uint32 width = 7;
  uint32 height = 8;
}

message DashboardDefinition {
  string name = 1;
  optional string description = 2;
  string app_id = 3;
  SharingScope sharing_scope = 4;
  optional string owner_id = 5;
  repeated DashboardPanel panels = 6;
}

// Dashboard is a persisted dashboard definition. version is an optimistic
// concurrency token and increases after every successful update.
message Dashboard {
  string dashboard_id = 1;
  uint64 version = 2;
  DashboardDefinition definition = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}
