syntax = "proto3";

package open_splunk;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Suhaibinator/open-splunk/gen/go/open_splunk;opensplunk";

// POST /api/hec/operations/get
// This route is administrator-only. The request is intentionally empty: HEC
// The contract exposes one process-wide bounded aggregate and no per-token selector.
message GetHECOperationalSnapshotRequest {}

message HECRequestOperationalMetrics {
  uint64 requests = 1;
  uint64 events = 2;
  uint64 uncompressed_bytes = 3;
  uint64 authentication_failures = 4;
  uint64 decode_failures = 5;
  uint64 event_policy_failures = 6;
  uint64 accepted_requests = 7;
  uint64 rate_limited_requests = 8;
  uint64 staging_failures = 9;
  google.protobuf.Duration staging_duration = 10;
  uint64 shutdown_rejections = 11;
}

message HECDurableOperationalMetrics {
  bool queue_available = 1;
  uint64 pending_outbox_reservations = 2;
  uint64 pending_outbox_bytes = 3;
  google.protobuf.Duration oldest_pending_outbox_age = 4;
  bool request_capacity_available = 5;
  uint64 retained_requests = 6;
}

message HECReconciliationOperationalMetrics {
  bool available = 1;
  uint64 successes = 2;
  uint64 retries = 3;
  uint64 ambiguities = 4;
}

// FixedHistogram is emitted only from compile-time bounded server buckets.
// upper_bounds has 13 entries and bucket_counts has one overflow entry (14).
message FixedHistogram {
  repeated uint64 upper_bounds = 1;
  repeated uint64 bucket_counts = 2;
  uint64 count = 3;
  uint64 sum = 4;
  uint64 max = 5;
}

// FixedLatencyHistogram records microseconds and is bounded to 11 upper
// bounds plus one overflow bucket.
message FixedLatencyHistogram {
  repeated uint64 upper_bounds_microseconds = 1;
  repeated uint64 bucket_counts = 2;
  uint64 count = 3;
  uint64 sum_microseconds = 4;
  uint64 max_microseconds = 5;
}

message HECInsertCoalescingQueueMetrics {
  uint64 pending_reservations = 1;
  uint64 ungrouped_reservations = 2;
  uint64 ready_groups = 3;
  uint64 ambiguous_groups = 4;
  uint64 leased_groups = 5;
  uint64 pending_outbox_bytes = 6;
  uint64 pending_metadata_bytes = 7;
  google.protobuf.Duration oldest_pending_age = 8;
}

// HECInsertCoalescingOperationalMetrics is a process-wide, payload-free
// projection. groups_by_fill_reason has the closed seven-value domain defined
// by the server and all histogram vectors have fixed lengths.
message HECInsertCoalescingOperationalMetrics {
  uint64 staged_logical_batches = 1;
  uint64 staged_logical_rows = 2;
  uint64 formed_groups = 3;
  uint64 physical_sends = 4;
  uint64 successful_groups = 5;
  uint64 retries = 6;
  uint64 ambiguities = 7;
  repeated uint64 groups_by_fill_reason = 8;
  FixedHistogram member_batches_per_group = 9;
  FixedHistogram rows_per_group = 10;
  FixedHistogram decoded_bytes_per_group = 11;
  FixedHistogram monthly_partitions_per_group = 12;
  FixedHistogram rows_per_physical_insert = 13;
  FixedLatencyHistogram creation_to_seal = 14;
  FixedLatencyHistogram creation_to_send = 15;
  FixedLatencyHistogram creation_to_commit = 16;
  uint64 native_waiters = 17;
  uint64 peak_native_waiters = 18;
  uint64 native_waiter_wakeups = 19;
  uint64 native_waiter_cancels = 20;
  uint64 native_terminal_lookups = 21;
  HECInsertCoalescingQueueMetrics queue = 22;
}

message HECAcknowledgmentOperationalMetrics {
  bool available = 1;
  uint64 active_channels = 2;
  uint64 retained_channels = 3;
  uint64 pending_rows = 4;
  uint64 indexed_rows = 5;
  uint64 expired_rows = 6;
  uint64 terminal_failed_requests = 7;
  uint64 queries = 8;
  uint64 ids_queried = 9;
  uint64 misses = 10;
}

// code is one of the closed non-success Splunk-compatible HEC response codes.
// This list has exactly the bounded domain 1 through 27 and never carries
// request-provided labels.
message HECProtocolFailureMetric {
  uint32 code = 1;
  uint64 count = 2;
}

message GetHECOperationalSnapshotResponse {
  google.protobuf.Timestamp observed_at = 1;
  HECRequestOperationalMetrics request = 2;
  HECDurableOperationalMetrics durable = 3;
  HECReconciliationOperationalMetrics reconciliation = 4;
  HECAcknowledgmentOperationalMetrics acknowledgments = 5;
  repeated HECProtocolFailureMetric protocol_failures = 6;
  HECInsertCoalescingOperationalMetrics insert_coalescing = 7;
}
