syntax = "proto3";

package open_splunk.v1;

import "open_splunk/v1/audit.proto";
import "open_splunk/v1/common.proto";

option go_package = "github.com/Suhaibinator/open-splunk/gen/go/open_splunk/v1;opensplunkv1";

// POST /api/v1/audit/events/list
// Lists retained events in descending sequence order. Filters are exact, and
// page tokens are bound to the filter set that produced them.
message ListAuditEventsRequest {
  PageRequest page = 1;
  repeated AuditAction action_filters = 2;
  optional string actor_id_filter = 3;
  optional AuditTargetKind target_kind_filter = 4;
}

message ListAuditEventsResponse {
  repeated AuditEvent audit_events = 1;
  PageResponse page = 2;
}
