syntax = "proto3";

package open_splunk;

import "google/protobuf/timestamp.proto";
import "open_splunk/common.proto";
import "open_splunk/knowledge.proto";

option go_package = "github.com/Suhaibinator/open-splunk/gen/go/open_splunk;opensplunk";

enum AuditActorKind {
  AUDIT_ACTOR_KIND_UNSPECIFIED = 0;
  AUDIT_ACTOR_KIND_SYSTEM = 1;
  AUDIT_ACTOR_KIND_BROWSER = 2;
}

enum AuditActorRole {
  AUDIT_ACTOR_ROLE_UNSPECIFIED = 0;
  AUDIT_ACTOR_ROLE_SYSTEM = 1;
  AUDIT_ACTOR_ROLE_USER = 2;
  AUDIT_ACTOR_ROLE_ADMINISTRATOR = 3;
}

enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  AUDIT_ACTION_INGESTION_TOKEN_CREATE = 1;
  AUDIT_ACTION_INGESTION_TOKEN_UPDATE = 2;
  AUDIT_ACTION_INGESTION_TOKEN_REVOKE = 3;
  AUDIT_ACTION_INDEX_CREATE = 4;
  AUDIT_ACTION_INDEX_UPDATE = 5;
  AUDIT_ACTION_INDEX_ACTIVATE = 6;
  AUDIT_ACTION_INDEX_ARCHIVE = 7;
  AUDIT_ACTION_INDEX_DELETE_KEEP_DATA = 8;
  AUDIT_ACTION_INDEX_DELETE_DATA = 9;
  AUDIT_ACTION_APP_CREATE = 10;
  AUDIT_ACTION_APP_UPDATE = 11;
  AUDIT_ACTION_APP_ACTIVATE = 12;
  AUDIT_ACTION_APP_ARCHIVE = 13;
  AUDIT_ACTION_APP_DELETE = 14;
  AUDIT_ACTION_SAVED_SEARCH_CREATE = 15;
  AUDIT_ACTION_SAVED_SEARCH_UPDATE = 16;
  AUDIT_ACTION_SAVED_SEARCH_DUPLICATE = 17;
  AUDIT_ACTION_SAVED_SEARCH_DELETE = 18;
  AUDIT_ACTION_KNOWLEDGE_OBJECT_CREATE = 19;
  AUDIT_ACTION_KNOWLEDGE_OBJECT_UPDATE = 20;
  AUDIT_ACTION_KNOWLEDGE_OBJECT_SCOPE_CHANGE = 21;
  AUDIT_ACTION_KNOWLEDGE_OBJECT_ENABLE = 22;
  AUDIT_ACTION_KNOWLEDGE_OBJECT_DISABLE = 23;
  AUDIT_ACTION_KNOWLEDGE_OBJECT_DELETE = 24;
}

enum AuditTargetKind {
  AUDIT_TARGET_KIND_UNSPECIFIED = 0;
  AUDIT_TARGET_KIND_INGESTION_TOKEN = 1;
  AUDIT_TARGET_KIND_INDEX = 2;
  AUDIT_TARGET_KIND_APP = 3;
  AUDIT_TARGET_KIND_SAVED_SEARCH = 4;
  AUDIT_TARGET_KIND_KNOWLEDGE_OBJECT = 5;
}

// AuditEvent is an immutable, allowlisted security-event projection.
// The contract deliberately has no arbitrary metadata, detail, or payload
// field. Implementations must never place secrets, token digests, credential
// material, authorization headers, request bodies, or generated SQL in any
// identity field.
message AuditEvent {
  uint64 sequence = 1;
  google.protobuf.Timestamp occurred_at = 2;
  AuditActorKind actor_kind = 3;
  string actor_id = 4;
  AuditActorRole actor_role = 5;
  AuditAction action = 6;
  AuditTargetKind target_kind = 7;
  string target_id = 8;
  uint64 target_version = 9;
  optional string app_id = 10;
  optional KnowledgeObjectType object_type = 11;
  optional SharingScope sharing_scope = 12;
}
