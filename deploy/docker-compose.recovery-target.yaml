# Retain this binding file for the complete lifetime of a restored deployment.
# Operators must create and independently verify all four named volumes as
# fresh before applying it. The read-only recovery-disk overlay is separate and
# may be removed after validation; these data/state bindings must not be.
volumes:
  clickhouse-data:
    external: true
    name: "${OPEN_SPLUNK_RECOVERY_CLICKHOUSE_DATA_VOLUME:?set a verified fresh ClickHouse data volume}"
  clickhouse-logs:
    external: true
    name: "${OPEN_SPLUNK_RECOVERY_CLICKHOUSE_LOGS_VOLUME:?set a verified fresh ClickHouse logs volume}"
  server-state:
    external: true
    name: "${OPEN_SPLUNK_RECOVERY_SERVER_STATE_VOLUME:?set a verified fresh server state volume}"
  server-exports:
    external: true
    name: "${OPEN_SPLUNK_RECOVERY_SERVER_EXPORTS_VOLUME:?set a verified fresh server exports volume}"
