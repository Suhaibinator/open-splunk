name: open-splunk

services:
  server:
    image: "${OPEN_SPLUNK_SERVER_IMAGE:?set OPEN_SPLUNK_SERVER_IMAGE to an exact Open Splunk server image}"
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TMPDIR: /tmp
      OPEN_SPLUNK_ADMINISTRATOR_TOKEN: "${OPEN_SPLUNK_ADMINISTRATOR_TOKEN:?set OPEN_SPLUNK_ADMINISTRATOR_TOKEN}"
      OPEN_SPLUNK_CLICKHOUSE_PASSWORD: "${OPEN_SPLUNK_CLICKHOUSE_PASSWORD:?set OPEN_SPLUNK_CLICKHOUSE_PASSWORD}"
      OPEN_SPLUNK_SERVER_SINGLETON_LOCK_PATH: /var/lib/open-splunk/lock/private/open-splunk-server-open_splunk.server.lock
    command:
      - -http-address
      - 0.0.0.0:8080
      - -http-allowed-hosts
      - "${OPEN_SPLUNK_HTTP_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      - "-hec-enabled=${OPEN_SPLUNK_HEC_ENABLED:-false}"
      - -control-db
      - /var/lib/open-splunk/state/private/open-splunk.db
      - -master-key
      - /var/lib/open-splunk/state/private/master.key
      - -export-artifact-dir
      - /var/lib/open-splunk/exports/private
      - -clickhouse-address
      - "${OPEN_SPLUNK_CLICKHOUSE_ADDRESS:-per-clickhouse:9000}"
      - -clickhouse-username
      - "${OPEN_SPLUNK_CLICKHOUSE_USERNAME:-clickhouse}"
    ports:
      - "${OPEN_SPLUNK_SERVER_HTTP_PORT:-8080}:8080"
    volumes:
      - server-state:/var/lib/open-splunk/state
      - server-lock:/var/lib/open-splunk/lock
      - server-exports:/var/lib/open-splunk/exports
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,uid=65532,gid=65532
    networks:
      - per-obs-network
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/open-splunk-server
        - healthcheck
        - -url
        - http://127.0.0.1:8080/readyz
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    stop_grace_period: 60s
    pids_limit: 512

volumes:
  server-state:
  server-lock:
  server-exports:

networks:
  per-obs-network:
    driver: bridge
