name: open-splunk

x-open-splunk-server-image: &open-splunk-server-image
  image: "${OPEN_SPLUNK_SERVER_IMAGE:?run ./generate-env.sh before docker compose up}"
  pull_policy: never

x-open-splunk-server-security: &open-splunk-server-security
  user: "65532:65532"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  # A fresh named-volume root is root-owned. This networkless one-shot makes
  # the recovery disk writable by ClickHouse while retaining read-only access
  # for the non-root backup and restore helpers through the shared fixed GID.
  clickhouse-recovery-volume-bootstrap:
    <<: *open-splunk-server-image
    user: "0:65532"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"
    healthcheck:
      disable: true
    network_mode: none
    command:
      - prepare-clickhouse-recovery-volume
      - -path
      - /var/lib/open-splunk/clickhouse-backups
      - -log-path
      - /var/log/clickhouse-server
    volumes:
      - clickhouse-recovery:/var/lib/open-splunk/clickhouse-backups
      - clickhouse-logs:/var/log/clickhouse-server
    pids_limit: 32

  clickhouse:
    # Current tested stable patch. Do not replace this with latest: schema
    # migrations depend on the production JSON type and GA native text index.
    image: clickhouse/clickhouse-server:26.7.5.10-alpine@sha256:0a45b864c73322d4360dea1973ee9b77f29c51af1242ad2d47409908071fa56e
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "65532"
    depends_on:
      clickhouse-recovery-volume-bootstrap:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_USER: open_splunk_bootstrap
      CLICKHOUSE_PASSWORD: "${OPEN_SPLUNK_CLICKHOUSE_BOOTSTRAP_PASSWORD:?run ./generate-env.sh before docker compose up}"
      # The official entrypoint otherwise writes a network-wide administrator
      # on every restart. Our users.d definition is loopback-only instead.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      # Re-running initialization recovers partial principal provisioning and
      # rotates every ClickHouse credential on the persistent volume.
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"
      OPEN_SPLUNK_CLICKHOUSE_MIGRATION_PASSWORD: "${OPEN_SPLUNK_CLICKHOUSE_MIGRATION_PASSWORD:?run ./generate-env.sh before docker compose up}"
      OPEN_SPLUNK_CLICKHOUSE_RUNTIME_PASSWORD: "${OPEN_SPLUNK_CLICKHOUSE_RUNTIME_PASSWORD:?run ./generate-env.sh before docker compose up}"
      OPEN_SPLUNK_CLICKHOUSE_DELETION_PASSWORD: "${OPEN_SPLUNK_CLICKHOUSE_DELETION_PASSWORD:?run ./generate-env.sh before docker compose up}"
      OPEN_SPLUNK_CLICKHOUSE_BACKUP_PASSWORD: "${OPEN_SPLUNK_CLICKHOUSE_BACKUP_PASSWORD:?run ./generate-env.sh before docker compose up}"
      OPEN_SPLUNK_CLICKHOUSE_RESTORE_PASSWORD: "${OPEN_SPLUNK_CLICKHOUSE_RESTORE_PASSWORD:?run ./generate-env.sh before docker compose up}"
      OPEN_SPLUNK_CLICKHOUSE_TLS_SERVER_NAME: "${OPEN_SPLUNK_CLICKHOUSE_TLS_SERVER_NAME:?run ./generate-env.sh before docker compose up}"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - clickhouse-recovery:/var/lib/open-splunk-clickhouse-backups
      - ./clickhouse-init.sh:/docker-entrypoint-initdb.d/0100_open_splunk.sh:ro
      - ./clickhouse-config/access.xml:/etc/clickhouse-server/config.d/open_splunk_access.xml:ro
      - ./clickhouse-config/bootstrap-user.xml:/etc/clickhouse-server/users.d/open_splunk_bootstrap.xml:ro
      - ./clickhouse-config/tls.xml:/etc/clickhouse-server/config.d/open_splunk_tls.xml:ro
      - ./clickhouse-config/client-tls.xml:/etc/clickhouse-client/open-splunk-tls.xml:ro
      - ./clickhouse-config/recovery.xml:/etc/clickhouse-server/config.d/open_splunk_recovery.xml:ro
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_CA_FILE:?run ./generate-env.sh before docker compose up}:/etc/clickhouse-client/open-splunk-ca.crt:ro"
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_CERT_FILE:?run ./generate-env.sh before docker compose up}:/etc/clickhouse-server/tls/server.crt:ro"
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_KEY_FILE:?run ./generate-env.sh before docker compose up}:/etc/clickhouse-server/tls/server.key:ro"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,uid=101,gid=101
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          CLICKHOUSE_PASSWORD="$${OPEN_SPLUNK_CLICKHOUSE_RUNTIME_PASSWORD}"
          clickhouse-client
          --config-file /etc/clickhouse-client/open-splunk-tls.xml
          --secure
          --host 127.0.0.1
          --port 9440
          --tls-sni-override "$${OPEN_SPLUNK_CLICKHOUSE_TLS_SERVER_NAME}"
          --user open_splunk_runtime
          --query "SELECT 1"
          >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # The exact server release image owns its embedded schema. This one-shot
  # container is the only Open Splunk process that receives the migrator
  # credential, and it exits before the long-running server can start.
  clickhouse-migrator:
    <<:
      - *open-splunk-server-image
      - *open-splunk-server-security
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      clickhouse:
        condition: service_healthy
    command:
      - migrate-clickhouse
      - -address
      - clickhouse:9440
      - -password-file
      - /run/open-splunk/clickhouse/migration.password
      - -ca-cert
      - /run/open-splunk/clickhouse/ca.crt
      - -server-name
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_SERVER_NAME:?run ./generate-env.sh before docker compose up}"
    volumes:
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_CA_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/clickhouse/ca.crt:ro"
      - "${OPEN_SPLUNK_CLICKHOUSE_MIGRATION_PASSWORD_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/clickhouse/migration.password:ro"
    networks:
      - backend
    pids_limit: 64

  # This one-shot service copies the host-retained token into the image-seeded,
  # fixed-UID private directory below the named-volume root. The source is
  # readable only through its owner-only host directory. The provisioner
  # atomically creates an EUID-owned 0600, single-link destination and
  # idempotently refuses to replace it with different material.
  server-bootstrap:
    <<:
      - *open-splunk-server-image
      - *open-splunk-server-security
    restart: "no"
    healthcheck:
      disable: true
    network_mode: none
    entrypoint:
      - /usr/local/bin/open-splunk-server
    command:
      - provision-administrator-token
      - -source
      - /run/open-splunk-bootstrap/administrator.token
      - -destination
      - /var/lib/open-splunk/state/private/administrator.token
    volumes:
      - server-state:/var/lib/open-splunk/state
      - "${OPEN_SPLUNK_ADMINISTRATOR_TOKEN_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk-bootstrap/administrator.token:ro"

  # Recovery helpers are opt-in and never join the normal application
  # lifecycle. The server must be stopped before either command is run.
  deployment-backup:
    profiles:
      - recovery
    <<:
      - *open-splunk-server-image
      - *open-splunk-server-security
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      clickhouse:
        condition: service_healthy
    command:
      - backup-deployment-recovery-set
      - -control-db
      - /var/lib/open-splunk/state/private/open-splunk.db
      - -master-key
      - /var/lib/open-splunk/state/private/master.key
      - -administrator-token-file
      - /var/lib/open-splunk/state/private/administrator.token
      - -destination
      - "${OPEN_SPLUNK_DEPLOYMENT_RECOVERY_SET_PATH:-/var/lib/open-splunk/recovery/private/deployment-recovery-set}"
      - -archive-root
      - /var/lib/open-splunk/clickhouse-backups
      - -address
      - clickhouse:9440
      - -password-file
      - /run/open-splunk/clickhouse/backup.password
      - -ca-cert
      - /run/open-splunk/clickhouse/ca.crt
      - -server-name
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_SERVER_NAME:?run ./generate-env.sh before docker compose up}"
    environment:
      OPEN_SPLUNK_SERVER_SINGLETON_LOCK_PATH: /var/lib/open-splunk/lock/private/open-splunk-server-open_splunk.server.lock
    volumes:
      - server-state:/var/lib/open-splunk/state
      - server-lock:/var/lib/open-splunk/lock
      - server-recovery:/var/lib/open-splunk/recovery
      - clickhouse-recovery:/var/lib/open-splunk/clickhouse-backups:ro
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_CA_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/clickhouse/ca.crt:ro"
      - "${OPEN_SPLUNK_CLICKHOUSE_BACKUP_PASSWORD_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/clickhouse/backup.password:ro"
    networks:
      - backend
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,uid=65532,gid=65532
    pids_limit: 64

  # An interrupted native BACKUP can retain its exact source marker after the
  # helper is gone. This operator-attested one-shot clears only that confirmed
  # marker after ClickHouse has been restarted to terminate any old native
  # operation. It receives neither control state nor either recovery volume.
  deployment-marker-reconcile:
    profiles:
      - recovery
    <<:
      - *open-splunk-server-image
      - *open-splunk-server-security
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      clickhouse:
        condition: service_healthy
    command:
      - reconcile-deployment-recovery-marker
      - -recovery-set-id
      - "${OPEN_SPLUNK_STALE_RECOVERY_SET_ID:-}"
      - -confirm-recovery-set-id
      - "${OPEN_SPLUNK_CONFIRMED_STALE_RECOVERY_SET_ID:-}"
      - -backup-operation-uuid
      - "${OPEN_SPLUNK_STALE_BACKUP_OPERATION_UUID:-}"
      - -confirm-backup-operation-uuid
      - "${OPEN_SPLUNK_CONFIRMED_STALE_BACKUP_OPERATION_UUID:-}"
      - -address
      - clickhouse:9440
      - -password-file
      - /run/open-splunk/clickhouse/backup.password
      - -ca-cert
      - /run/open-splunk/clickhouse/ca.crt
      - -server-name
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_SERVER_NAME:?run ./generate-env.sh before docker compose up}"
    environment:
      OPEN_SPLUNK_SERVER_SINGLETON_LOCK_PATH: /var/lib/open-splunk/lock/private/open-splunk-server-open_splunk.server.lock
    volumes:
      - server-lock:/var/lib/open-splunk/lock
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_CA_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/clickhouse/ca.crt:ro"
      - "${OPEN_SPLUNK_CLICKHOUSE_BACKUP_PASSWORD_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/clickhouse/backup.password:ro"
    networks:
      - backend
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,uid=65532,gid=65532
    pids_limit: 64

  # A failed backup can leave ClickHouse's already-closed archive behind when
  # the normal helper's read-only mount correctly prevents deletion. This is
  # an explicitly destructive, operator-attested one-shot: it cannot infer
  # publication status, so ClickHouse must be stopped and both names must be
  # copied independently from the same failed-attempt diagnostic.
  deployment-archive-delete:
    profiles:
      - recovery
    <<: *open-splunk-server-image
    user: "101:65532"
    working_dir: /
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    healthcheck:
      disable: true
    network_mode: none
    command:
      - delete-deployment-recovery-archive
      - -archive-root
      - /var/lib/open-splunk/clickhouse-backups
      - -archive-name
      - "${OPEN_SPLUNK_FAILED_RECOVERY_ARCHIVE_NAME:-}"
      - -confirm-archive-name
      - "${OPEN_SPLUNK_CONFIRMED_RECOVERY_ARCHIVE_NAME:-}"
    volumes:
      - clickhouse-recovery:/var/lib/open-splunk/clickhouse-backups
    pids_limit: 32

  deployment-verify:
    profiles:
      - recovery
    <<:
      - *open-splunk-server-image
      - *open-splunk-server-security
    restart: "no"
    healthcheck:
      disable: true
    network_mode: none
    command:
      - verify-deployment-recovery-set
      - -source
      - "${OPEN_SPLUNK_DEPLOYMENT_RECOVERY_SET_PATH:-/var/lib/open-splunk/recovery/private/deployment-recovery-set}"
      - -archive-root
      - /var/lib/open-splunk/clickhouse-backups
    volumes:
      - server-recovery:/var/lib/open-splunk/recovery:ro
      - clickhouse-recovery:/var/lib/open-splunk/clickhouse-backups:ro
    pids_limit: 64

  deployment-restore:
    profiles:
      - recovery
    <<:
      - *open-splunk-server-image
      - *open-splunk-server-security
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      clickhouse:
        condition: service_healthy
    command:
      - restore-deployment-recovery-set
      - -source
      - "${OPEN_SPLUNK_DEPLOYMENT_RECOVERY_SET_PATH:-/var/lib/open-splunk/recovery/private/deployment-recovery-set}"
      - -archive-root
      - /var/lib/open-splunk/clickhouse-backups
      - -control-db
      - /var/lib/open-splunk/state/private/open-splunk.db
      - -master-key
      - /var/lib/open-splunk/state/private/master.key
      - -administrator-token-file
      - /var/lib/open-splunk/state/private/administrator.token
      - -address
      - clickhouse:9440
      - -password-file
      - /run/open-splunk/clickhouse/restore.password
      - -ca-cert
      - /run/open-splunk/clickhouse/ca.crt
      - -server-name
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_SERVER_NAME:?run ./generate-env.sh before docker compose up}"
    environment:
      OPEN_SPLUNK_SERVER_SINGLETON_LOCK_PATH: /var/lib/open-splunk/lock/private/open-splunk-server-open_splunk.server.lock
    volumes:
      - server-state:/var/lib/open-splunk/state
      - server-lock:/var/lib/open-splunk/lock
      - server-recovery:/var/lib/open-splunk/recovery:ro
      - clickhouse-recovery:/var/lib/open-splunk/clickhouse-backups:ro
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_CA_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/clickhouse/ca.crt:ro"
      - "${OPEN_SPLUNK_CLICKHOUSE_RESTORE_PASSWORD_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/clickhouse/restore.password:ro"
    networks:
      - backend
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,uid=65532,gid=65532
    pids_limit: 64

  server:
    <<:
      - *open-splunk-server-image
      - *open-splunk-server-security
    restart: unless-stopped
    init: true
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-migrator:
        condition: service_completed_successfully
      server-bootstrap:
        condition: service_completed_successfully
    environment:
      TMPDIR: /tmp
      OPEN_SPLUNK_SERVER_SINGLETON_LOCK_PATH: /var/lib/open-splunk/lock/private/open-splunk-server-open_splunk.server.lock
    command:
      - -http-address
      - 0.0.0.0:8080
      - -http-allowed-hosts
      - "localhost,127.0.0.1,open-splunk-server"
      - -http-tls-cert
      - /run/open-splunk/tls/server.crt
      - -http-tls-key
      - /run/open-splunk/tls/server.key
      - "-hec-enabled=${OPEN_SPLUNK_HEC_ENABLED:-false}"
      - -collector-grpc-address
      - 0.0.0.0:4317
      - -collector-tls-cert
      - /run/open-splunk/tls/server.crt
      - -collector-tls-key
      - /run/open-splunk/tls/server.key
      - -control-db
      - /var/lib/open-splunk/state/private/open-splunk.db
      - -master-key
      - /var/lib/open-splunk/state/private/master.key
      - -administrator-token-file
      - /var/lib/open-splunk/state/private/administrator.token
      - -export-artifact-dir
      - /var/lib/open-splunk/exports/private
      - -clickhouse-address
      - clickhouse:9440
      - -clickhouse-secure
      - -clickhouse-ca-cert
      - /run/open-splunk/clickhouse/ca.crt
      - -clickhouse-server-name
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_SERVER_NAME:?run ./generate-env.sh before docker compose up}"
      - -clickhouse-skip-migrations
      - -clickhouse-runtime-password-file
      - /run/open-splunk/clickhouse/runtime.password
      - -clickhouse-deletion-password-file
      - /run/open-splunk/clickhouse/deletion.password
    ports:
      - "127.0.0.1:${OPEN_SPLUNK_SERVER_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${OPEN_SPLUNK_SERVER_GRPC_PORT:-4317}:4317"
    volumes:
      - server-state:/var/lib/open-splunk/state
      - server-lock:/var/lib/open-splunk/lock
      - server-exports:/var/lib/open-splunk/exports
      - "${OPEN_SPLUNK_SERVER_TLS_CA_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/tls/ca.crt:ro"
      - "${OPEN_SPLUNK_SERVER_TLS_CERT_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/tls/server.crt:ro"
      - "${OPEN_SPLUNK_SERVER_TLS_KEY_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/tls/server.key:ro"
      - "${OPEN_SPLUNK_CLICKHOUSE_TLS_CA_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/clickhouse/ca.crt:ro"
      - "${OPEN_SPLUNK_CLICKHOUSE_RUNTIME_PASSWORD_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/clickhouse/runtime.password:ro"
      - "${OPEN_SPLUNK_CLICKHOUSE_DELETION_PASSWORD_FILE:?run ./generate-env.sh before docker compose up}:/run/open-splunk/clickhouse/deletion.password:ro"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,uid=65532,gid=65532
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/open-splunk-server
        - healthcheck
        - -url
        - https://127.0.0.1:8080/readyz
        - -ca-cert
        - /run/open-splunk/tls/ca.crt
        - -server-name
        - "${OPEN_SPLUNK_SERVER_TLS_SERVER_NAME:?run ./generate-env.sh before docker compose up}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    stop_grace_period: 60s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

networks:
  frontend:
  backend:
    internal: true

volumes:
  clickhouse-data:
  clickhouse-logs:
  clickhouse-recovery:
  server-state:
  server-exports:
  server-recovery:
  server-lock:
