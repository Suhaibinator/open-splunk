# Test-only exposure for host-side verified native-protocol assertions. The
# production full-stack file publishes no ClickHouse port.
services:
  clickhouse:
    ports:
      - "127.0.0.1:${OPEN_SPLUNK_CLICKHOUSE_SECURE_NATIVE_PORT:?integration test must request a host port}:9440"

# Host-side integration clients need the verified native listener. Production
# leaves this network internal and publishes no ClickHouse port.
networks:
  backend:
    internal: false
